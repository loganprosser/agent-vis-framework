name: strands_agent_demo
version: 0.1.0
description: |
  Single-node demo that runs an Amazon Strands Agent. Requires
  ``pip install -e ".[strands]"`` and a working model provider (e.g. a RITS
  provider configured via ./configure-model.sh).
entrypoint: research
nodes:
- id: research
  type: strands_agent
  model: mock-deterministic
  provider: mock
  system_prompt: ''
  input_keys:
  - prompt
  output_keys:
  - answer
  tools: []
  mcps: []
  retry_policy:
    max_attempts: 1
    backoff_seconds: 0.0
  human_approval: false
  config:
    agent_module: app.subsystems.examples.strands_research_agent
    agent_factory: build_research_agent
    prompt_key: prompt
    input_map:
      topic: inputs.prompt
    output_map:
      answer: answer
    ui:
      x: 240
      y: 240
edges: []
