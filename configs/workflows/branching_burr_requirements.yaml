name: branching_burr_requirements
version: 0.1.0
description: Validate and repair requirements inside a branching Burr subsystem.
entrypoint: requirements_input

nodes:
  - id: requirements_input
    type: mock_requirements_input
    provider: mock
    model: mock-deterministic
    output_keys:
      - raw_requirements
    tools: []

  - id: validate_and_structure_requirements
    type: burr_subsystem
    provider: mock
    model: mock-deterministic
    input_keys:
      - requirements_input
    output_keys:
      - structured_requirements
      - validation_status
    tools: []
    config:
      app_module: app.subsystems.branching_requirements_burr_app
      app_factory: build_branching_requirements_app
      input_map:
        raw_requirements: node_outputs.requirements_input.raw_requirements
      output_map:
        structured_requirements: structured_requirements
        validation_status: validation_status
      halt_after:
        - structure_requirements
      topology:
        entrypoint: validate_requirements
        actions:
          - id: validate_requirements
            label: Validate requirements
            kind: router
            description: Decide whether the requirements need repair.
            reads:
              - raw_requirements
            writes:
              - validation_status
          - id: repair_requirements
            label: Repair requirements
            kind: agent
            description: Expand incomplete requirements before structuring them.
            reads:
              - raw_requirements
            writes:
              - raw_requirements
              - repair_happened
          - id: structure_requirements
            label: Structure requirements
            kind: agent
            description: Produce the normalized requirements payload.
            reads:
              - raw_requirements
            writes:
              - structured_requirements
              - validation_status
        transitions:
          - source: validate_requirements
            target: repair_requirements
            condition: validation_status == repair_required
          - source: validate_requirements
            target: structure_requirements
            condition: validation_status == valid
          - source: repair_requirements
            target: structure_requirements
            condition: default

edges:
  - source: requirements_input
    target: validate_and_structure_requirements
